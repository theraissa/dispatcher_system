services:

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://red-d7rqjta8qa3s73dn05ig:6379
    ports:
    - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://dispatcher-system-mmw5.onrender.com
    ports:
      - "8080:80"

  database:
    image: postgres:16
    environment: 
      POSTGRES_DB: db-system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
