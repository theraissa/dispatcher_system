services:
  unit:
    build:
      context: ./backend
      dockerfile: tests/Dockerfile
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:postgres@postgres_test:5432/dispatcher_test
    volumes:
      - ./backend:/app
    working_dir: /app
    command: pytest tests/unit -v

  integration:
    build:
      context: ./backend
      dockerfile: tests/Dockerfile
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:postgres@postgres_test:5432/dispatcher_test
    volumes:
      - ./backend:/app
    working_dir: /app
    command: pytest tests/integration -v
    depends_on:
      postgres_test:
        condition: service_healthy

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_DB: dispatcher_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
