services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
      build: ./backend
      ports:
        - "5000:5000"
      volumes:
        - ./backend:/app
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PYTHONDONTWRITEBYTECODE=1 # impede criação de __pycache__
        - PYTHONUNBUFFERED=1 # logs em tempo real
        - FLASK_ENV=development
        - FLASK_DEBUG=1
        - DATABASE_URL=postgresql://admin:admin@database:5432/db-system
      command: python app.py
      depends_on:
        - database
        - redis

  frontend:
    image: node:20-alpine 
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: db-system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - database
