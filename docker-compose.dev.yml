services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: 1 # impede criação de __pycache__
      PYTHONUNBUFFERED: 1 # logs em tempo real
      FLASK_ENV: development
      FLASK_DEBUG: 1
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://admin:admin@database:5432/db-system
    command: python app.py
    depends_on:
      - database
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/dispatcher-system
    depends_on:
      - backend

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: db-system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
